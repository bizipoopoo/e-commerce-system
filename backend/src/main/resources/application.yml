spring:
  application:
    name: aurora-commerce
  profiles:
    default: local
  datasource:
    url: jdbc:h2:mem:aurora;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: Aurora Commerce
    stage: development

commerce:
  web:
    allowed-origins:
      - ${STOREFRONT_ORIGIN:http://localhost:5173}
      - ${ADMIN_ORIGIN:http://localhost:5174}
      - ${STOREFRONT_LOOPBACK_ORIGIN:http://127.0.0.1:5173}
      - ${ADMIN_LOOPBACK_ORIGIN:http://127.0.0.1:5174}
  security:
    jwt-secret: ${JWT_SECRET:aurora-commerce-demo-secret-change-before-production-2026}
    access-token-ttl: 2h
  bootstrap:
    enabled: false
