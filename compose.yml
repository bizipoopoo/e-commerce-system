services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: aurora_commerce
      MYSQL_USER: aurora
      MYSQL_PASSWORD: aurora_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

volumes:
  mysql-data:

