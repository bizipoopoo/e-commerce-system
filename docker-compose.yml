name: aurora-commerce

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aurora_commerce}
      MYSQL_USER: ${MYSQL_USER:-aurora}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aurora-demo-database-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aurora-demo-root-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod,demo
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-aurora_commerce}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${MYSQL_USER:-aurora}
      DB_PASSWORD: ${MYSQL_PASSWORD:-aurora-demo-database-password}
      JWT_SECRET: ${JWT_SECRET:-aurora-commerce-compose-demo-secret-2026-change-me}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@aurora.local}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Aurora@2026}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    restart: unless-stopped
    ports:
      - "${STOREFRONT_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
