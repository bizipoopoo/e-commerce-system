name: Bug report
description: 报告可复现的功能缺陷
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 感谢反馈。安全漏洞请通过 Security 页面的私密报告入口提交。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明实际行为、预期行为以及影响。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动……
        2. 访问……
        3. 执行……
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: 版本或提交
      placeholder: v0.2.0 或 Git commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、浏览器、Java/Node 版本及部署方式。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先移除 Token、Cookie、密码和个人数据。
