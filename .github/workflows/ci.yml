name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode test

  web:
    name: Web production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  delivery:
    name: Compose delivery smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MYSQL_PASSWORD: aurora-ci-database-password
      MYSQL_ROOT_PASSWORD: aurora-ci-root-password
      JWT_SECRET: aurora-commerce-ci-signing-secret-2026-minimum-32-bytes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test deployment rollback orchestration
        run: bash scripts/test-deploy.sh
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Validate release Docker Compose
        env:
          DEPLOY_ENVIRONMENT: staging
          DEMO_ADMIN_PASSWORD: aurora-ci-admin-password
          BACKEND_IMAGE: ghcr.io/bizipoopoo/aurora-commerce-backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          STOREFRONT_IMAGE: ghcr.io/bizipoopoo/aurora-commerce-storefront@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          ADMIN_IMAGE: ghcr.io/bizipoopoo/aurora-commerce-admin@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: docker compose -f deployment/compose.release.yml config --quiet
      - name: Build, start and verify the demo stack
        shell: bash
        run: |
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              docker compose ps
              docker compose logs --no-color | tee compose-smoke.log
            fi
            docker compose down --volumes
            exit "$status"
          }
          trap cleanup EXIT
          docker compose up --build --detach
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:3000/actuator/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:3000/actuator/health > /dev/null
          SMOKE_BASE_URL=http://localhost:3000 npm run smoke
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-smoke-logs
          path: compose-smoke.log
          if-no-files-found: ignore
          retention-days: 7
