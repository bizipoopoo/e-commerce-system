name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode test

  web:
    name: Web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  delivery:
    name: Compose delivery smoke test
    runs-on: ubuntu-latest
    env:
      MYSQL_PASSWORD: aurora-ci-database-password
      MYSQL_ROOT_PASSWORD: aurora-ci-root-password
      JWT_SECRET: aurora-commerce-ci-signing-secret-2026-minimum-32-bytes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build, start and verify the demo stack
        shell: bash
        run: |
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              docker compose ps
              docker compose logs --no-color
            fi
            docker compose down --volumes
            exit "$status"
          }
          trap cleanup EXIT
          docker compose up --build --detach
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:3000/actuator/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:3000/actuator/health > /dev/null
          SMOKE_BASE_URL=http://localhost:3000 npm run smoke
